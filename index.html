<body>
<div class="top"><span id="quality" role="status">대기 중</span><span style="font-size:15px">빨강 위반 · 노랑 경고</span></div>
<div id="ev" class="evg"><div class="c"><span>급가속</span><span><b style="color:var(--brk)">0</b> / <b style="color:var(--acc)">0</b></span></div><div class="c"><span>급출발</span><span><b style="color:var(--brk)">0</b> / <b style="color:var(--acc)">0</b></span></div><div class="c"><span>급감속</span><span><b style="color:var(--brk)">0</b> / <b style="color:var(--acc)">0</b></span></div><div class="c"><span>급정지</span><span><b style="color:var(--brk)">0</b> / <b style="color:var(--acc)">0</b></span></div></div>
<div class="speed"><b id="v">0</b><span>km/h</span></div>
<div class="msg" id="msg">시작을 누르세요</div>
<div class="gauge"><div class="fill" id="fill"></div><div class="mid"></div>
<div class="lim" id="limB" style="left:calc(50% - 9 / 14 * 50% - 1px)"></div>
<div class="lim" id="limA" style="left:calc(50% + 8 / 14 * 50% - 1px)"></div></div>
<div class="scale"><span id="lbB">감속 −9</span><span id="gps">GPS 대기</span><span id="acc" hidden></span><span id="lbA">가속 +8</span></div>

<button id="btn">시작</button>
<button id="hbtn" class="ghost">기록 보기</button>
<div id="hist"></div><section id="routePanel" hidden></section><div class="footer-meta"><label class="sound-toggle"><input type="checkbox" id="snd" checked> 소리 알림</label><p id="diagStatus">D2-UI2 · 자동 저장</p></div>
<p class="note safety-note">화면을 켜 둔 채 거치대에 두고 사용하세요.<br>운전 중에는 소리로 확인하세요.</p>
<script>
const MAX=14;
const $=id=>document.getElementById(id);
let watch=null, hist=[], cnt=null, prevLvl='ok', ctx=null, lock=null, lastBeep=0, lastKmh=null, prevDanger=false, lastLvl='';

// 최대 음량(1.0)의 사각파 + 스피커가 잘 내는 고음역대로 크고 또렷하게
function tone(t,dur,f1,f2){
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type='square';
  o.frequency.setValueAtTime(f1,t);
  if(f2) o.frequency.setValueAtTime(f2,t+dur/2);
  g.gain.setValueAtTime(1,t); g.gain.setValueAtTime(1,t+dur-0.02); g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur);
}
// 삡: 짧은 단음
function beep(freq,n){
  if(!$('snd').checked||!ctx) return;
  const t0=ctx.currentTime+0.02;
  for(let i=0;i<n;i++) tone(t0+i*0.3,0.22,freq);
}
// 삐입 삐입: 높은 음에서 낮은 음으로 떨어지는 소리를 두 번
function chirp(freq,n){
  if(!$('snd').checked||!ctx) return;
  const t0=ctx.currentTime+0.02;
  for(let i=0;i<n;i++) tone(t0+i*0.45,0.34,freq,freq*0.7);
}
const TYPES=['급가속','급출발','급감속','급정지'];
function newCnt(){ const o={}; TYPES.forEach(k=>o[k]=[0,0]); return o; }
function updEv(){
  const shown=effectiveCounts({cnt,events:drive?.events||[]});
  $('ev').innerHTML=TYPES.map(k=>'<div class="c"><span>'+k+'</span><span><b style="color:var(--brk)">'+shown[k][0]+'</b> / <b style="color:var(--acc)">'+shown[k][1]+'</b></span></div>').join('');
}
let active=false, warmAt=0, warmTimer=null, saveTimer=null, drive=null, km=0;
const KEY='drive_log_v1';
// Diagnostics are observers only: no values below feed the driving classifier.
const DIAG_VERSION='2026-11-13-D2-UI2';
let diag=null, sample=null, diagRing=[], diagDBPromise=null, diagLastEnded=null, diagPrunedAt=0;
function diagStatus(message){$('diagStatus').textContent=message;}
function diagDB(){
  if(!diagDBPromise) diagDBPromise=new Promise((resolve,reject)=>{
    const r=indexedDB.open('smooth_drive_diagnostics',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('drives',{keyPath:'id'});
    r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
    r.onblocked=()=>diagStatus('진단 저장 준비 중 · 같은 앱의 다른 창을 닫아 주세요.');
  });
  return diagDBPromise;
}
async function diagWrite(data){
  const db=await diagDB();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction('drives','readwrite'), store=tx.objectStore('drives');
    store.put(data);
    if(Date.now()-diagPrunedAt>864e5){
      diagPrunedAt=Date.now();
      const r=store.openCursor();
      r.onsuccess=()=>{const c=r.result;if(c){if(c.value.start<Date.now()-30*864e5)c.delete();c.continue();}};
    }
    tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
  });
}
function diagSave(){
  if(!diag)return;
  diag.updatedAt=Date.now();
  const snapshot=JSON.parse(JSON.stringify(diag));
  diagWrite(snapshot).then(()=>diagStatus('D2-UI2 · 저장 '+fmtT(snapshot.updatedAt)+((snapshot.droppedClips||snapshot.droppedSamples||snapshot.droppedRoute||snapshot.droppedHolds)?' · 일부 기록은 저장 상한으로 생략':''))).catch(()=>diagStatus('진단 저장 실패 · 운행 종료 전 진단 파일을 내려받으세요.'));
}
function diagBegin(){
  diagRing=[];
  diag={id:drive.id,start:drive.start,version:DIAG_VERSION,endedNormally:false,settings:{accuracyMaxM:15,referenceMs:[500,1800],previousMinMs:600,startReferenceMs:[1500,2600],startSpeedMax:5,smoothingOld:0.3,smoothingNew:0.7,accelRejectAbove:11,brakeRejectBelow:-18,movingAccelRejectAbove:9,turnDivisor:10,turnPenaltyMax:2,warningMargin:1,accelLimits:[8,7,6],brakeLimits:[9,10,12],preSeconds:8,postSeconds:5,routeIntervalSeconds:5,clipCap:300,routeCap:10000,fullSampleCap:36000,missingSpeedPolicy:'hold_no_coordinate_fallback',extremePolicy:'hold_reset',recoveryMs:1800,gapMs:2500,warmupMinMs:5000,warmupSpanMs:2000,warmupMinSamples:3,warmupChangeLimit:6},sampleColumns:SAMPLE_COLUMNS,samples:[],droppedSamples:0,validSamples:0,heldSamples:0,holds:[],droppedHolds:0,warmupStartedAt:warmAt,clips:[],route:[],droppedClips:0,droppedRoute:0};
}
function diagFinish(s){
  if(!diag)return;
  if(diag.samples.length<36000)diag.samples.push(SAMPLE_COLUMNS.map(k=>{
    const v=s[k];return typeof v==='number'&&Number.isFinite(v)?(k==='gpsT'||k==='receivedAt'||k==='chosenRefT'?v:Math.round(v*1e6)/1e6):v??null;
  }));else diag.droppedSamples++;
  if(s.quality==='valid')diag.validSamples++;else diag.heldSamples++;
  diagRing.push(s);diagRing=diagRing.filter(x=>s.receivedAt-x.receivedAt<=8000).slice(-120);
  let last=diag.clips[diag.clips.length-1];
  const candidate=s.quality==='hold'||!!s.event||s.acceleration>=4||s.acceleration<=-7||s.status.includes('제외');
  if(last&&s.receivedAt<=last.until&&last.samples.length<120){
    last.samples.push(s);
    if(candidate)last.until=Math.min(last.startedAt+60000,s.receivedAt+5000);
  }else if(candidate){
    if(diag.clips.length<300){
      last={startedAt:s.receivedAt,until:s.receivedAt+5000,reason:s.event?'이벤트':s.status,samples:diagRing.slice()};diag.clips.push(last);
    }else diag.droppedClips++;
  }
  const rp=diag.route[diag.route.length-1];
  if(!rp||s.receivedAt-rp.receivedAt>=5000){
    if(diag.route.length<10000)diag.route.push({gpsT:s.gpsT,receivedAt:s.receivedAt,lat:s.lat,lon:s.lon,rawSpeed:s.rawSpeed,accuracy:s.accuracy,accepted:s.quality==='valid',quality:s.quality,status:s.status});
    else diag.droppedRoute++;
  }
  diag.lastSampleAt=s.receivedAt;
  if(s.event) saveDrive();
}
async function diagRead(id){
  if(diag&&diag.id===id)return JSON.parse(JSON.stringify(diag));
  if(diagLastEnded&&diagLastEnded.id===id)return JSON.parse(JSON.stringify(diagLastEnded));
  const db=await diagDB();
  return new Promise((resolve,reject)=>{const r=db.transaction('drives').objectStore('drives').get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});
}
async function diagDelete(id){
  if(id==null||diagLastEnded?.id===id)diagLastEnded=null;
  try{const db=await diagDB();const tx=db.transaction('drives','readwrite');const st=tx.objectStore('drives');if(id==null)st.clear();else st.delete(id);}catch(e){diagStatus('진단 기록 삭제 실패');}
}
async function diagExport(id,copy){
  try{
    const data=await diagRead(id);
    if(!data){alert('이 운행에는 진단 기록이 없어요. D1 시험판으로 새로 측정한 운행부터 저장됩니다.');return;}
    const basic=(drive&&drive.id===id)?drive:loadLog().find(x=>x.id===id);
    const payload={format:'smooth-drive-diagnostics-v1',units:{sensorSpeed:'m/s',speed:'km/h',acceleration:'km/h/s',time:'Unix milliseconds',position:'WGS84 degrees',accuracy:'m'},timezone:'Asia/Seoul',note:'D2 samples는 sampleColumns 순서의 전체 수신 기록입니다. GPS 수신 공백은 복원되지 않으며 holds에 기록됩니다. 보류는 정상 판정이 아닙니다. 측정값은 독립 장비로 검증되지 않았습니다. 회전 완화는 실제 기준 필드에만 기록합니다. 전후 구간은 GPS 콜백이 도착한 범위만 포함합니다. 경로에는 제외된 측정값도 accepted=false로 남습니다.',drive:basic||null,diagnostics:data};
    const text=JSON.stringify(payload,null,2);
    if(copy){
      try{await navigator.clipboard.writeText(text);alert('진단 기록을 복사했어요. 대화에 붙여 넣어 주세요.');}

  const an=(a>0?'+':'')+a.toFixed(1);
  const pct=Math.min(Math.abs(a),MAX)/MAX*50;
  const f=$('fill');
  f.style.width=pct+'%'; f.style.left=a>=0?'50%':(50-pct)+'%';
  let kind=null, lvl='ok', name='';
  if(a>0){
    kind='a'; name=ta;
    if(a>=la) lvl='d'; else if(a>=la-1) lvl='w';
  }else{
    const stopping=v<=5;
    if(stopping||v>5){
      kind='b'; name=stopping?'급정지':'급감속';
      const lim=stopping?9+pen:lb;
      if(-a>=lim) lvl='d'; else if(-a>=lim-1) lvl='w';
    }
  }
  const lbShow=v<=5?9+pen:lb;
  $('limA').style.left='calc(50% + '+la+' / '+MAX+' * 50% - 1px)';
  $('limB').style.left='calc(50% - '+lbShow+' / '+MAX+' * 50% - 1px)';
  $('lbA').textContent='가속 +'+la; $('lbB').textContent='감속 −'+lbShow;
  f.style.background=lvl==='d'?'var(--brk)':lvl==='w'?'var(--acc)':'var(--ok)';
  document.body.className=lvl==='ok'?'':lvl;
  $('msg').textContent=lvl==='d'?name+'! '+an:lvl==='w'?(kind==='a'?'가속 주의 ':'감속 주의 ')+an:an+' km/h/초';
  if(sample) Object.assign(sample,{status:'판정완료',level:lvl,type:name,previousLevel:prevLvl,previousDanger:prevDanger,eventRule:'위반진입시_경고는정상에서진입시',actualLimit:kind==='a'?la:lbShow});
  const danger=lvl==='d';
  if(danger&&!prevDanger){ cnt[name][0]++; updEv(); rec('d',name,v,a,acc,kind==='a'?la:lbShow,turn); }
  if(lvl==='w'&&(prevLvl==='ok'||prevLvl==='unknown')){ cnt[name][1]++; updEv(); rec('w',name,v,a,acc,kind==='a'?la:lbShow,turn); }

  prevDanger=danger;

}
async function start(){

  try{ if(navigator.wakeLock) lock=await navigator.wakeLock.request('screen'); }catch(e){}
  resetMotion();holdSince=null;lastCallbackAt=Date.now();
  qualityTimer=setInterval(checkSignal,1000);
  cnt=newCnt(); prevLvl='ok'; hist=[]; lastKmh=null; prevDanger=false; lastLvl=''; active=false; warmAt=0; drive=null;
  updEv();
  $('msg').textContent='GPS 신호 찾는 중…'; $('quality').textContent='GPS 연결 중';
  watch=navigator.geolocation.watchPosition(onPos,err=>{
    hold(err.code===1?'위치 권한 없음':'GPS 수신 오류',true);$('v').textContent='—';
  },{enableHighAccuracy:true,maximumAge:0,timeout:10000});
  $('btn').textContent='종료'; $('btn').className='stop';
}
function stop(){
  if(active) beep(1500,1); endDrive();
  if(watch!=null) navigator.geolocation.clearWatch(watch); watch=null;
  try{ lock&&lock.release(); }catch(e){} lock=null;
  document.body.className=''; $('quality').textContent='대기 중'; $('msg').textContent='시작을 누르세요';
  $('quality').textContent='대기 중';

const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function downloadText(text,name,type='application/json'){
  const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
}
async function exportDay(start){
  if(active)saveDrive();
  const drives=loadLog().filter(d=>dayKey(d.start)===dayKey(start)).sort((a,b)=>a.start-b.start);
  const items=[],missing=[];
  for(const d of drives){let diagnostic=null;try{diagnostic=await diagRead(d.id);}catch(e){}if(!diagnostic)missing.push(d.id);items.push({drive:d,adjustedCounts:effectiveCounts(d),excludedEventCount:(d.events||[]).filter(e=>e.userError===true).length,diagnostics:diagnostic});}
  if(missing.length)alert('진단 기록이 없는 운행 '+missing.length+'건은 요약만 포함합니다.');
  downloadText(JSON.stringify({format:'smooth-drive-day-v1',timezone:'Asia/Seoul',exportedAt:Date.now(),date:dayKey(start),missingDiagnosticIds:missing,items}), 'drive-day-'+dayKey(start)+'.json');
}
function csvText(d){
  const cols=d.sampleColumns||[],rows=d.samples||[];
  const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const header=['gpsTimeISO','gpsTimeKST',...cols];
  const time=ms=>Number.isFinite(ms)?new Date(ms):null;
  return '\uFEFF'+[header,...rows.map(r=>{const date=time(r[0]);return [date?.toISOString()||'',date?.toLocaleString('sv-SE',{timeZone:'Asia/Seoul'})||'',...r];})].map(row=>row.map(cell).join(',')).join('\r\n');
}
async function exportCSV(id){
  try{const d=await diagRead(id);if(!d?.samples?.length){alert('초별 비교 CSV는 D2로 새로 측정한 운행부터 제공됩니다.');return;}downloadText(csvText(d),'drive-comparison-'+id+'.csv','text/csv;charset=utf-8');}catch(e){alert('비교 기록을 읽지 못했어요.');}
}
// Map display observes stored data only; it never feeds the D2 classifier.
const hasPosition=p=>Number.isFinite(p?.lat)&&Number.isFinite(p?.lon)&&Math.abs(p.lat)<=90&&Math.abs(p.lon)<=180;
function routeData(d){
  const cols=d?.sampleColumns||[];
  const samples=(d?.samples||[]).map(row=>Object.fromEntries(cols.map((k,i)=>[k,row[i]])));
  // Full samples first; sparse route also preserves the tail after the sample cap.
  const points=samples.slice(),seen=new Set(samples.map(p=>p.gpsT+'|'+p.receivedAt));
  for(const p of d?.route||[])if(!seen.has(p.gpsT+'|'+p.receivedAt))points.push(p);
  points.sort((a,b)=>(a.receivedAt??a.gpsT)-(b.receivedAt??b.gpsT));
  return points;
}
function routeSegments(route){
  const out=[];let seg=[],prev=null;
  for(const p of route||[]){
    if(!hasPosition(p)){if(seg.length)out.push(seg);seg=[];prev=null;continue;}
    const dt=prev?(p.gpsT-prev.gpsT)/1000:0;
    // Retain jumps and held positions. Only missing/reversed time breaks the line.
    if(prev&&(!Number.isFinite(dt)||dt<=0||dt>15)){out.push(seg);seg=[];}
    seg.push(p);prev=p;
  }
  if(seg.length)out.push(seg);return out;
}
const eventStyle=n=>({'급가속':['#8b5cf6','가'],'급출발':['#2563eb','출'],'급감속':['#ea580c','감'],'급정지':['#dc2626','정']}[n]||['#475569','?']);
let routeView=null,routeToken=0,leafletLoadPromise=null,routeMap=null,routeMarkers=[];
function closeRoute(){
  routeToken++;if(routeMap){routeMap.remove();routeMap=null;}routeMarkers=[];
  $('routePanel').hidden=true;routeView=null;
}
function eventDetail(e){
  const s=routeView?.points.find(p=>p.gpsT===e.gpsT&&hasPosition(p)&&Math.abs(p.lat-e.lat)<=0.000001&&Math.abs(p.lon-e.lon)<=0.000001);
  const num=(v,suffix='')=>Number.isFinite(v)?v+suffix:'기록 없음';
  const reason=e.reason||(Number.isFinite(e.a)?e.n+' '+(e.l==='d'?'위반 기준 충족':'경고 구간 진입')+' · 가속도 '+e.a+' km/h/초':'판정 사유 기록 없음');
  return (e.userError?'사용자 오류 표시 · 통계 제외\n':'')+fmtS(e.t)+' · '+e.n+' '+(e.l==='d'?'위반':'경고')+'\n속도 '+num(e.v,' km/h')+
    (Number.isFinite(s?.chosenRefSpeed)?' (비교 속도 '+s.chosenRefSpeed+' km/h → 현재)':'')+
    '\n판정 사유: '+reason+'\nGPS 오차: '+num(e.acc,' m')+
    '\nGPS 신뢰도: '+(s?s.quality==='valid'?'판정 가능 (정확도 보증 아님)':'판정 보류 / '+(s.status||'사유 없음'):'상세 수신 기록 없음 · 신뢰도 확인 불가')+
    (s?'\n수신 상태: '+(s.status||'기록 없음')+' · 수신 간격 '+num(s.callbackDt,'초'):'')+
    '\nGPS 시각: '+(Number.isFinite(e.gpsT)?fmtS(e.gpsT):'기록 없음')+
    (!hasPosition(e)?'\n좌표 없음 · 지도 위치를 추정하지 않습니다.':'');
}
function detailNode(text){const el=document.createElement('div');el.style.whiteSpace='pre-wrap';el.textContent=text;return el;}
function selectRouteEvent(i){
  const e=routeView?.events[i];if(!e)return;
  $('routeDetail').textContent=eventDetail(e);

function loadLeaflet(){
  if(window.L&&document.querySelector('link[data-drive-leaflet-ready]'))return Promise.resolve();
  if(leafletLoadPromise)return leafletLoadPromise;
  leafletLoadPromise=new Promise((resolve,reject)=>{
    const css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    const s=document.createElement('script');let done=false,ready=0;
    const finish=error=>{if(done)return;if(!error&&++ready<2)return;done=true;clearTimeout(timer);if(error){s.remove();css.remove();leafletLoadPromise=null;reject(error);}else resolve();};
    const timer=setTimeout(()=>finish(Error('지도 라이브러리 연결 시간 초과')),12000);
    s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    s.onload=()=>finish(window.L?null:Error('지도 라이브러리를 읽지 못했습니다.'));
    css.onload=()=>{css.dataset.driveLeafletReady='true';finish();};
    css.onerror=s.onerror=()=>finish(Error('인터넷 연결을 확인해 주세요.'));
    document.head.append(css,s);
  });return leafletLoadPromise;
}
async function drawLeafletRoute(token){
  try{
    await loadLeaflet();if(token!==routeToken||!routeView)return;
    if(routeMap)routeMap.remove();
    const map=routeMap=L.map('routeMap',{preferCanvas:true}).setView([37.5665,126.978],12);
    // Browser cache and normal Referer are preserved. No prefetch/offline tile cache.
    if(/^https?:$/.test(location.protocol)){
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
        maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        updateWhenIdle:true,keepBuffer:1
      }).on('tileerror',()=>{if(token===routeToken)$('mapStatus').textContent='배경 지도 연결 실패 · GPS 궤적과 이벤트는 그대로 표시합니다.';}).addTo(map);
      $('mapStatus').textContent='저장된 운행 경로';
    }else $('mapStatus').textContent='파일로 열면 GPS 궤적만 표시합니다. 도로 배경은 기존 HTTPS 앱 주소 또는 localhost에서 확인하세요.';
    const raw=L.layerGroup().addTo(map),held=L.layerGroup().addTo(map);
    const positions=[];
    for(const seg of routeView.segments){
      const coords=seg.map(p=>[p.lat,p.lon]);positions.push(...coords);
      if(coords.length>1)L.polyline(coords,{color:'#168fe5',weight:3,smoothFactor:0}).addTo(raw);
      else L.circleMarker(coords[0],{radius:3,color:'#168fe5'}).addTo(raw);
    }
    for(const p of routeView.points){
      if(!hasPosition(p)||p.quality==='valid'||(p.quality==null&&p.accepted===true))continue;
      L.circleMarker([p.lat,p.lon],{radius:4,color:'#64748b',weight:2,fillOpacity:0.5})
        .bindPopup(detailNode('GPS 보류/신뢰도 미확인\n'+(Number.isFinite(p.gpsT)?fmtS(p.gpsT):'시각 없음')+'\n'+(p.status||'상세 상태 없음')+'\nGPS 오차: '+(p.accuracy??'기록 없음')+' m'),{minWidth:220,maxWidth:280,maxHeight:220}).addTo(held);
    }
    routeMarkers=[];
    routeView.events.forEach((e,i)=>{
      if(!hasPosition(e))return;
      positions.push([e.lat,e.lon]);const color=e.userError?'#94a3b8':e.l==='d'?'#ff5a6e':'#f2b134';
      const marker=L.marker([e.lat,e.lon],{title:e.n+' '+(e.userError?'오류 표시':e.l==='d'?'위반':'경고'),
        icon:L.divIcon({className:'eventPin',html:'<span style="background:'+color+'">'+escapeHTML(e.n)+'</span>',iconSize:[62,30],iconAnchor:[31,15]})})
        .bindPopup(detailNode(eventDetail(e)),{minWidth:220,maxWidth:280,maxHeight:220}).addTo(map);
      marker.on('click',()=>{$('routeDetail').textContent=eventDetail(e);});routeMarkers[i]=marker;
    });
    const valid=routeView.points.filter(hasPosition);
    if(valid.length)[[valid[0],'출발'],[valid.at(-1),'종료']].forEach(([p,label])=>{
      L.circleMarker([p.lat,p.lon],{radius:6,color:'#064e3b',fillColor:'#fff',fillOpacity:1}).bindTooltip(label,{permanent:true,direction:'top'}).addTo(map);
    });
    L.control.layers(null,{'원본 GPS 궤적':raw,'보류·신뢰도 미확인 좌표':held},{collapsed:true}).addTo(map);
    if(positions.length)map.fitBounds(L.latLngBounds(positions),{padding:[30,30],maxZoom:16});
    else $('mapStatus').textContent='저장된 GPS 좌표가 없습니다. 아래 이벤트 상세는 확인할 수 있어요.';
    map.invalidateSize();
    $('routeFit').onclick=()=>{if(positions.length)map.fitBounds(L.latLngBounds(positions),{padding:[30,30],maxZoom:16});};
  }catch(e){if(token===routeToken)$('mapStatus').textContent=e.message+' 아래 이벤트 목록은 사용할 수 있습니다. 지도 다시 시도를 눌러 주세요.';}
}
async function openRoute(id){
