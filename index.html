<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>부드러운 운전</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1a1f;--fg:#e8f1ef;--mute:#7f9a98;--ok:#5fd0b0;--acc:#f2b134;--brk:#ff5a6e;--line:#26393e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f6f5;--fg:#12262b;--mute:#587274;--ok:#0f8a6a;--acc:#b97700;--brk:#d02745;--line:#c9d9d7;color-scheme:light}}
:root[data-theme="dark"]{--bg:#0e1a1f;--fg:#e8f1ef;--mute:#7f9a98;--ok:#5fd0b0;--acc:#f2b134;--brk:#ff5a6e;--line:#26393e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Barlow Condensed","Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;flex-direction:column;padding:16px;transition:background .15s}
body.w{background:color-mix(in srgb,var(--acc) 28%,var(--bg))}
body.d{background:color-mix(in srgb,var(--brk) 32%,var(--bg))}
.top{display:flex;justify-content:space-between;color:var(--mute);font-size:18px}
.evg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;text-align:center}
.evg .c{background:var(--line);border-radius:8px;padding:6px 2px;display:flex;flex-direction:column;font-size:16px;color:var(--mute)}
.evg b{font-size:24px}
.speed{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.speed b{font-size:min(38vw,190px);line-height:.9;font-weight:700;letter-spacing:-.02em}
.speed span{color:var(--mute);font-size:22px}
.msg{text-align:center;font-size:30px;min-height:40px;font-weight:700}
.gauge{position:relative;height:34px;margin:14px 4px 6px;background:var(--line);border-radius:6px;overflow:hidden}
.mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--mute)}
.fill{position:absolute;top:0;bottom:0;left:50%;width:0;background:var(--ok)}
.lim{position:absolute;top:0;bottom:0;width:3px;background:var(--fg);opacity:.85}
.scale{display:flex;justify-content:space-between;color:var(--mute);font-size:16px;margin:0 4px 12px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:18px;color:var(--mute)}
button{font:inherit;font-size:24px;font-weight:700;padding:16px;border:0;border-radius:10px;background:var(--ok);color:#06231b;width:100%;margin-top:12px;cursor:pointer}
button.stop{background:var(--line);color:var(--fg)}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.ghost{background:var(--line);color:var(--fg);font-size:18px;padding:10px 14px;width:auto;margin:8px 6px 0 0}
#hist{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));display:none}
#hist.on{display:block}
.day{border-top:1px solid var(--line);padding:12px 0;font-size:18px}
.day h3{margin:0 0 6px;font-size:22px}
.dr{margin-top:8px;font-size:16px}
.dr summary{cursor:pointer;color:var(--mute);padding:6px 0}
.el{margin-top:8px}
.er{display:grid;grid-template-columns:52px 78px 40px 36px minmax(0,1fr);gap:3px;font-size:15px;padding:4px 0;border-bottom:1px solid var(--line)}
.er.hd{color:var(--mute)}
.er span:nth-child(-n+4){white-space:nowrap}
.note{font-size:16px;color:var(--mute);text-align:center;margin:10px 0 0;line-height:1.35}
body.q{background:color-mix(in srgb,#548ac1 22%,var(--bg))}
#quality{min-height:1.3em;color:#85b9ee;font-size:16px;text-align:center;margin:5px 0}
#routePanel{position:fixed;inset:0;z-index:30;overflow:auto;padding:20px;background:var(--bg)}
#routePanel[hidden]{display:none}#routePanel p{font-size:16px;line-height:1.5}#routePanel a{color:var(--ok)}
.routeDot{cursor:pointer}.routeDot:focus{outline:2px solid white}
</style>
</head>
<body>
<div class="top"><span id="st">대기 중</span><span style="font-size:15px">빨강 위반 · 노랑 경고</span></div>
<div id="ev" class="evg"><div class="c"><span>급가속</span><span><b style="color:var(--brk)">0</b> / <b style="color:var(--acc)">0</b></span></div><div class="c"><span>급출발</span><span><b style="color:var(--brk)">0</b> / <b style="color:var(--acc)">0</b></span></div><div class="c"><span>급감속</span><span><b style="color:var(--brk)">0</b> / <b style="color:var(--acc)">0</b></span></div><div class="c"><span>급정지</span><span><b style="color:var(--brk)">0</b> / <b style="color:var(--acc)">0</b></span></div></div>
<div class="speed"><b id="v">0</b><span>km/h</span></div>
<div id="quality" role="status">D2 · 측정 대기</div><div class="msg" id="msg">시작을 누르세요</div>
<div class="gauge"><div class="fill" id="fill"></div><div class="mid"></div>
<div class="lim" id="limB" style="left:calc(50% - 9 / 14 * 50% - 1px)"></div>
<div class="lim" id="limA" style="left:calc(50% + 8 / 14 * 50% - 1px)"></div></div>
<div class="scale"><span id="lbB">감속 −9</span><span id="acc"></span><span id="lbA">가속 +8</span></div>
<div class="row"><span>소리 알림 <input type="checkbox" id="snd" checked></span><span id="gps">GPS 대기</span></div>
<button id="btn">시작</button>
<button id="hbtn" class="ghost">기록 보기</button>
<div id="hist"></div><section id="routePanel" hidden></section><p id="diagStatus" class="note">진단 시험판 D2 · 전후 기록 자동 저장</p>
<p class="note">화면을 켜 둔 채 거치대에 두고 사용하세요. 운전 중에는 화면을 보지 말고 소리로 확인하세요.</p>
<script>
const MAX=14;
const $=id=>document.getElementById(id);
let watch=null, hist=[], cnt=null, prevLvl='ok', ctx=null, lock=null, lastBeep=0, lastKmh=null, prevDanger=false, lastLvl='';

// 최대 음량(1.0)의 사각파 + 스피커가 잘 내는 고음역대로 크고 또렷하게
function tone(t,dur,f1,f2){
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type='square';
  o.frequency.setValueAtTime(f1,t);
  if(f2) o.frequency.setValueAtTime(f2,t+dur/2);
  g.gain.setValueAtTime(1,t); g.gain.setValueAtTime(1,t+dur-0.02); g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur);
}
// 삡: 짧은 단음
function beep(freq,n){
  if(!$('snd').checked||!ctx) return;
  const t0=ctx.currentTime+0.02;
  for(let i=0;i<n;i++) tone(t0+i*0.3,0.22,freq);
}
// 삐입 삐입: 높은 음에서 낮은 음으로 떨어지는 소리를 두 번
function chirp(freq,n){
  if(!$('snd').checked||!ctx) return;
  const t0=ctx.currentTime+0.02;
  for(let i=0;i<n;i++) tone(t0+i*0.45,0.34,freq,freq*0.7);
}
const TYPES=['급가속','급출발','급감속','급정지'];
function newCnt(){ const o={}; TYPES.forEach(k=>o[k]=[0,0]); return o; }
function updEv(){
  $('ev').innerHTML=TYPES.map(k=>'<div class="c"><span>'+k+'</span><span><b style="color:var(--brk)">'+cnt[k][0]+'</b> / <b style="color:var(--acc)">'+cnt[k][1]+'</b></span></div>').join('');
}
let active=false, warmAt=0, warmTimer=null, saveTimer=null, drive=null, km=0;
const KEY='drive_log_v1';
// Diagnostics are observers only: no values below feed the driving classifier.
const DIAG_VERSION='2026-11-09-D2';
let diag=null, sample=null, diagRing=[], diagDBPromise=null, diagLastEnded=null, diagPrunedAt=0;
function diagStatus(message){$('diagStatus').textContent=message;}
function diagDB(){
  if(!diagDBPromise) diagDBPromise=new Promise((resolve,reject)=>{
    const r=indexedDB.open('smooth_drive_diagnostics',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('drives',{keyPath:'id'});
    r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
    r.onblocked=()=>diagStatus('진단 저장 준비 중 · 같은 앱의 다른 창을 닫아 주세요.');
  });
  return diagDBPromise;
}
async function diagWrite(data){
  const db=await diagDB();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction('drives','readwrite'), store=tx.objectStore('drives');
    store.put(data);
    if(Date.now()-diagPrunedAt>864e5){
      diagPrunedAt=Date.now();
      const r=store.openCursor();
      r.onsuccess=()=>{const c=r.result;if(c){if(c.value.start<Date.now()-30*864e5)c.delete();c.continue();}};
    }
    tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
  });
}
function diagSave(){
  if(!diag)return;
  diag.updatedAt=Date.now();
  const snapshot=JSON.parse(JSON.stringify(diag));
  diagWrite(snapshot).then(()=>diagStatus('진단 D2 · 저장 완료 '+fmtT(snapshot.updatedAt)+((snapshot.droppedClips||snapshot.droppedSamples||snapshot.droppedRoute||snapshot.droppedHolds)?' · 일부 기록은 저장 상한으로 생략':''))).catch(()=>diagStatus('진단 저장 실패 · 운행 종료 전 진단 파일을 내려받으세요.'));
}
function diagBegin(){
  diagRing=[];
  diag={id:drive.id,start:drive.start,version:DIAG_VERSION,endedNormally:false,settings:{accuracyMaxM:15,referenceMs:[500,1800],previousMinMs:600,startReferenceMs:[1500,2600],startSpeedMax:5,smoothingOld:0.3,smoothingNew:0.7,accelRejectAbove:11,brakeRejectBelow:-18,movingAccelRejectAbove:9,turnDivisor:10,turnPenaltyMax:2,warningMargin:1,accelLimits:[8,7,6],brakeLimits:[9,10,12],preSeconds:8,postSeconds:5,routeIntervalSeconds:5,clipCap:300,routeCap:10000,fullSampleCap:36000,missingSpeedPolicy:'hold_no_coordinate_fallback',extremePolicy:'hold_reset',recoveryMs:1800,gapMs:2500,warmupMinMs:5000,warmupSpanMs:2000,warmupMinSamples:3,warmupChangeLimit:6},sampleColumns:SAMPLE_COLUMNS,samples:[],droppedSamples:0,validSamples:0,heldSamples:0,holds:[],droppedHolds:0,warmupStartedAt:warmAt,clips:[],route:[],droppedClips:0,droppedRoute:0};
}
function diagFinish(s){
  if(!diag)return;
  if(diag.samples.length<36000)diag.samples.push(SAMPLE_COLUMNS.map(k=>{
    const v=s[k];return typeof v==='number'&&Number.isFinite(v)?(k==='gpsT'||k==='receivedAt'||k==='chosenRefT'?v:Math.round(v*1e6)/1e6):v??null;
  }));else diag.droppedSamples++;
  if(s.quality==='valid')diag.validSamples++;else diag.heldSamples++;
  diagRing.push(s);diagRing=diagRing.filter(x=>s.receivedAt-x.receivedAt<=8000).slice(-120);
  let last=diag.clips[diag.clips.length-1];
  const candidate=s.quality==='hold'||!!s.event||s.acceleration>=4||s.acceleration<=-7||s.status.includes('제외');
  if(last&&s.receivedAt<=last.until&&last.samples.length<120){
    last.samples.push(s);
    if(candidate)last.until=Math.min(last.startedAt+60000,s.receivedAt+5000);
  }else if(candidate){
    if(diag.clips.length<300){
      last={startedAt:s.receivedAt,until:s.receivedAt+5000,reason:s.event?'이벤트':s.status,samples:diagRing.slice()};diag.clips.push(last);
    }else diag.droppedClips++;
  }
  const rp=diag.route[diag.route.length-1];
  if(!rp||s.receivedAt-rp.receivedAt>=5000){
    if(diag.route.length<10000)diag.route.push({gpsT:s.gpsT,receivedAt:s.receivedAt,lat:s.lat,lon:s.lon,rawSpeed:s.rawSpeed,accuracy:s.accuracy,accepted:s.quality==='valid',quality:s.quality,status:s.status});
    else diag.droppedRoute++;
  }
  diag.lastSampleAt=s.receivedAt;
  if(s.event) saveDrive();
}
async function diagRead(id){
  if(diag&&diag.id===id)return JSON.parse(JSON.stringify(diag));
  if(diagLastEnded&&diagLastEnded.id===id)return JSON.parse(JSON.stringify(diagLastEnded));
  const db=await diagDB();
  return new Promise((resolve,reject)=>{const r=db.transaction('drives').objectStore('drives').get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});
}
async function diagDelete(id){
  if(id==null||diagLastEnded?.id===id)diagLastEnded=null;
  try{const db=await diagDB();const tx=db.transaction('drives','readwrite');const st=tx.objectStore('drives');if(id==null)st.clear();else st.delete(id);}catch(e){diagStatus('진단 기록 삭제 실패');}
}
async function diagExport(id,copy){
  try{
    const data=await diagRead(id);
    if(!data){alert('이 운행에는 진단 기록이 없어요. D1 시험판으로 새로 측정한 운행부터 저장됩니다.');return;}
    const basic=(drive&&drive.id===id)?drive:loadLog().find(x=>x.id===id);
    const payload={format:'smooth-drive-diagnostics-v1',units:{sensorSpeed:'m/s',speed:'km/h',acceleration:'km/h/s',time:'Unix milliseconds',position:'WGS84 degrees',accuracy:'m'},timezone:'Asia/Seoul',note:'D2 samples는 sampleColumns 순서의 전체 수신 기록입니다. GPS 수신 공백은 복원되지 않으며 holds에 기록됩니다. 보류는 정상 판정이 아닙니다. 측정값은 독립 장비로 검증되지 않았습니다. 회전 완화는 실제 기준 필드에만 기록합니다. 전후 구간은 GPS 콜백이 도착한 범위만 포함합니다. 경로에는 제외된 측정값도 accepted=false로 남습니다.',drive:basic||null,diagnostics:data};
    const text=JSON.stringify(payload,null,2);
    if(copy){
      try{await navigator.clipboard.writeText(text);alert('진단 기록을 복사했어요. 대화에 붙여 넣어 주세요.');}
      catch(e){const ta=$('hta');ta.style.display='block';ta.value=text;ta.select();alert('텍스트 상자에서 전체 선택 후 복사해 주세요.');}
    }else{
      const url=URL.createObjectURL(new Blob([text],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='drive-'+(data.version||'legacy')+'-'+id+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
    }
  }catch(e){alert('진단 기록을 읽지 못했어요. 저장 상태를 확인해 주세요.');}
}

function loadLog(){ try{ return JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ return []; } }
function saveDrive(){
  if(!drive) return;
  drive.end=Date.now(); drive.km=Math.round(km*10)/10;
  diagSave();
  try{
    let log=loadLog().filter(d=>d.id!==drive.id); log.push(drive);
    const cut=Date.now()-30*864e5; log=log.filter(d=>d.start>cut);
    localStorage.setItem(KEY,JSON.stringify(log));
  }catch(e){ diagStatus('기본 운행기록 저장 실패: 저장 공간을 확인하고 진단 파일을 내려받으세요.'); }
}
function rec(l,n,v,a,acc,lim,turn){
  if(!drive||drive.events.length>=500) return;
  if(sample){ sample.event={level:l,name:n}; sample.trigger='이벤트'; }
  drive.events.push({lat:sample?.lat??null,lon:sample?.lon??null,gpsT:sample?.gpsT??null,t:Date.now(),n:n,l:l,v:Math.round(v*10)/10,a:Math.round(a*10)/10,acc:Math.round(acc),lim:Math.round(lim*10)/10,tn:Math.round(turn||0)});
  if(!sample) saveDrive();
}
function warmTick(){
  const left=Math.ceil((5000-(Date.now()-warmAt))/1000);
  if(left>0){ $('msg').textContent='GPS 안정화 중… '+left; return; }
  if(warmGood.length<QUALITY.warmSamples||warmGood.at(-1).t-warmGood[0].t<QUALITY.warmSpanMs||Date.now()-warmGood.at(-1).receivedAt>2500){
    $('msg').textContent='GPS 안정화 중… 정상 속도 확인';return;
  }
  clearInterval(warmTimer); warmTimer=null;
  active=true; resetMotion(); km=0; cnt=newCnt(); updEv();
  drive={id:Date.now(),start:Date.now(),end:Date.now(),km:0,cnt:cnt,events:[],version:DIAG_VERSION};
  diagBegin();
  saveTimer=setInterval(saveDrive,15000); saveDrive();
  $('st').textContent=lock?'측정 중 · 화면유지':'측정 중 · 화면유지 불가';
  $('msg').textContent='측정 시작'; beep(2000,1);
}
function endDrive(){
  clearInterval(qualityTimer);qualityTimer=null;
  clearInterval(warmTimer); clearInterval(saveTimer); warmTimer=saveTimer=null;
  if(diag) {diag.endedAt=Date.now(); diag.endedNormally=true;}
  closeHold();
  saveDrive(); drive=null; diagLastEnded=diag; diag=null; sample=null; active=false; warmAt=0;
}
const fmtT=ms=>new Date(ms).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});
const dayKey=ms=>{ const d=new Date(ms); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
function cellsHTML(c){ return TYPES.map(k=>'<div class="c"><span>'+k+'</span><span><b style="color:var(--brk)">'+c[k][0]+'</b> / <b style="color:var(--acc)">'+c[k][1]+'</b></span></div>').join(''); }
function copyLog(log){
  const txt=log.map(d=>(d.version?'[앱 '+d.version+']\n':'')+'['+new Date(d.start).toLocaleDateString('ko-KR')+' '+fmtT(d.start)+'~'+fmtT(d.end)+' '+d.km+'km 최대가속 '+(d.maxA!=null?d.maxA.toFixed(1):'-')+' 최대감속 '+(d.minA!=null?d.minA.toFixed(1):'-')+']\n'+d.events.map(e=>new Date(e.t).toLocaleTimeString('ko-KR',{hour12:false})+' '+e.n+' '+(e.l==='d'?'위반':'경고')+' 속도'+e.v+' 가속도'+e.a+'(기준'+(e.lim==null?'-':baseLim(e.n,e.v))+') GPS오차'+e.acc+'m 회전'+(e.tn||0)+'도/초'+(Number.isFinite(e.lat)&&Number.isFinite(e.lon)?' 위치 '+e.lat+','+e.lon:'')).join('\n')).join('\n\n');
  const ta=$('hta');
  Promise.resolve().then(()=>navigator.clipboard.writeText(txt)).then(()=>{ $('hc').textContent='복사됨'; }).catch(()=>{ ta.style.display='block'; ta.value=txt; ta.select(); });
}
// 기록에 표시하는 기준은 회전 완화를 뺀 순수 위반 기준(정수)
function baseLim(n,v){
  if(n==='급출발') return 8;
  if(n==='급가속') return v<11?8:v<21?7:6;
  if(n==='급정지') return 9;
  return v<=30?9:v<=50?10:12;
}
const fmtS=ms=>new Date(ms).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
// Official Naver Maps marker deep link; Android uses an intent for app/store routing.
function naverMapURL(e){
  const params='lat='+encodeURIComponent(e.lat)+'&lng='+encodeURIComponent(e.lon)
    +'&name='+encodeURIComponent(e.n+' '+(e.l==='d'?'위반':'경고')+' '+fmtS(e.t))
    +'&appname='+encodeURIComponent(location.origin+location.pathname);
  return /Android/i.test(navigator.userAgent||'')
    ? 'intent://place?'+params+'#Intent;scheme=nmap;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.nhn.android.nmap;end'
    : 'nmap://place?'+params;
}
function driveHTML(d){
  const nd=TYPES.reduce((s,t)=>s+d.cnt[t][0],0), nw=TYPES.reduce((s,t)=>s+d.cnt[t][1],0);

function routeSegments(route){
  const out=[];let seg=[],prev=null;
  for(const p of route||[]){
    const valid=p.accepted!==false&&Number.isFinite(p.lat)&&Number.isFinite(p.lon)&&Number.isFinite(p.gpsT)&&p.accuracy<=15;
    if(!valid){if(seg.length)out.push(seg);seg=[];prev=null;continue;}
    if(prev){const dt=(p.gpsT-prev.gpsT)/1000,dy=(p.lat-prev.lat)*111320,dx=(p.lon-prev.lon)*111320*Math.cos(p.lat*Math.PI/180);
      if(dt<=0||dt>15||Math.hypot(dx,dy)/dt*3.6>120){if(seg.length)out.push(seg);seg=[];}}
    seg.push(p);prev=p;
  }
  if(seg.length)out.push(seg);return out;
}

  const cos=Math.cos(points[0].lat*Math.PI/180),xy=p=>[p.lon*cos,-p.lat];
  const all=points.concat(events.filter(e=>Number.isFinite(e.lat)&&Number.isFinite(e.lon)));
  const xs=all.map(p=>xy(p)[0]),ys=all.map(p=>xy(p)[1]),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const scale=Math.min(540/Math.max(maxX-minX,0.0001),370/Math.max(maxY-minY,0.0001));
  const project=p=>{const [x,y]=xy(p);return [(x-(minX+maxX)/2)*scale+300,(y-(minY+maxY)/2)*scale+215];};
  const point=p=>project(p).map(x=>x.toFixed(2)).join(',');
  let svg='<svg viewBox="0 0 600 430" role="img" aria-label="도로 배경 없는 GPS 경로 미리보기" style="width:100%;max-height:55vh;background:var(--line);border-radius:12px"><text x="16" y="24" fill="var(--fg)" font-size="16">북 ↑ · GPS 경로 미리보기</text>';
  for(const seg of segments)svg+='<polyline points="'+seg.map(point).join(' ')+'" fill="none" stroke="#55b9f3" stroke-width="3"/>';
  [[points[0],'출발'],[points.at(-1),'종료']].forEach(([p,label])=>{const [x,y]=project(p);svg+='<circle cx="'+x+'" cy="'+y+'" r="5" fill="var(--fg)"/><text x="'+(x+7)+'" y="'+(y-7)+'" fill="var(--fg)" font-size="14">'+label+'</text>';});
  events.forEach((e,i)=>{if(!Number.isFinite(e.lat)||!Number.isFinite(e.lon))return;const [x,y]=project(e);svg+='<g class="routeDot" data-event="'+i+'" tabindex="0" role="button" aria-label="'+escapeHTML(fmtS(e.t)+' '+e.n)+'"><circle cx="'+x+'" cy="'+y+'" r="12" fill="'+(e.l==='d'?'#ff5a6e':'#f2b134')+'"/><text x="'+x+'" y="'+(y+4)+'" text-anchor="middle" font-size="12" fill="#102028">'+(i+1)+'</text></g>';});
  $('routePreview').innerHTML=svg+'</svg>';
  document.querySelectorAll('.routeDot').forEach(el=>{el.onclick=()=>selectRouteEvent(Number(el.dataset.event));el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.onclick();}};});
}
function loadNaverSDK(key){
  if(window.naver?.maps)return Promise.resolve();
  if(naverLoadPromise)return naverLoadPromise;
  naverLoadPromise=new Promise((resolve,reject)=>{
    const s=document.createElement('script');let done=false;
    const finish=error=>{if(done)return;done=true;clearTimeout(timer);if(error){s.remove();naverLoadPromise=null;reject(error);}else resolve();};
    const timer=setTimeout(()=>finish(Error('지도를 불러오지 못했습니다. 네트워크와 지도 설정을 확인해 주세요.')),12000);
    window.navermap_authFailure=()=>{const message='네이버지도 인증 실패 · Client ID와 등록된 Web 서비스 URL을 확인해 주세요.';if($('mapStatus'))$('mapStatus').textContent=message;finish(Error(message));};
    s.src='https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId='+encodeURIComponent(key);
    s.onload=()=>finish(window.naver?.maps?null:Error('네이버지도 설정을 확인해 주세요.'));s.onerror=()=>finish(Error('네이버지도에 연결하지 못했습니다.'));document.head.appendChild(s);
  });return naverLoadPromise;
}
async function drawNaverRoute(key,token){
  $('mapStatus').textContent='네이버지도 불러오는 중…';
  try{
    await loadNaverSDK(key);if(token!==routeToken||!routeView)return;
    const M=naver.maps,points=routeView.segments.flat();if(!points.length){$('mapStatus').textContent='표시할 경로가 없습니다.';return;}
    if(naverMapInstance)naverMapInstance.destroy();$('naverMap').hidden=false;
    const map=naverMapInstance=new M.Map('naverMap',{center:new M.LatLng(points[0].lat,points[0].lon),zoom:13});
    const bounds=new M.LatLngBounds();points.forEach(p=>bounds.extend(new M.LatLng(p.lat,p.lon)));
    routeView.segments.forEach(seg=>{if(seg.length>1)new M.Polyline({map,path:seg.map(p=>new M.LatLng(p.lat,p.lon)),strokeColor:'#168fe5',strokeWeight:4});});
    const info=new M.InfoWindow({content:'',borderWidth:0});
    routeView.events.forEach((e,i)=>{if(!Number.isFinite(e.lat)||!Number.isFinite(e.lon))return;
      const marker=new M.Marker({map,position:new M.LatLng(e.lat,e.lon),title:fmtS(e.t)+' '+e.n,icon:{content:'<div style="border-radius:50%;width:28px;height:28px;line-height:28px;text-align:center;background:'+(e.l==='d'?'#ff5a6e':'#f2b134')+';color:#111;font-weight:bold;border:2px solid white">'+(i+1)+'</div>',anchor:new M.Point(14,14)}});
      M.Event.addListener(marker,'click',()=>{selectRouteEvent(i);info.setContent('<div style="padding:10px;color:#111;background:white;font-size:14px">'+escapeHTML($('routeDetail').textContent)+'</div>');info.open(map,marker);});
    });
    [[points[0],'출발'],[points.at(-1),'종료']].forEach(([p,label])=>new M.Marker({map,position:new M.LatLng(p.lat,p.lon),title:label,icon:{content:'<div style="background:#153e58;color:white;border:2px solid white;padding:3px 6px;border-radius:5px;white-space:nowrap">'+label+'</div>'}}));
    map.fitBounds(bounds);$('routePreview').hidden=true;$('mapStatus').textContent='네이버지도 · 저장된 GPS 경로와 이벤트 전체';
  }catch(e){if(token===routeToken){$('mapStatus').textContent=e.message;$('routePreview').hidden=false;$('naverMap').hidden=true;}}
}
async function openRoute(id){
  if(active){alert('운행을 종료한 뒤 전체 경로를 확인해 주세요.');return;}
  closeRoute();const token=++routeToken;$('routePanel').hidden=false;
  $('routePanel').innerHTML='<button class="ghost" id="routeClose">닫기</button><h2 id="routeTitle">운행 경로</h2><p id="mapStatus" role="status">경로 읽는 중…</p><div id="naverMap" style="height:55vh;min-height:320px" hidden></div><div id="routePreview"></div><p>파랑: 경로 · 빨강: 위반 · 노랑: 경고<br>GPS 기록점을 연결한 경로입니다. 수신 공백·불량 구간은 선을 끊어 표시합니다.</p><p id="routeDetail">번호를 누르면 이벤트를 확인할 수 있어요.</p><div id="routeEvents"></div><details><summary>네이버지도 연결 설정</summary><p>네이버 클라우드 Maps의 지도용 Client ID를 입력해 주세요. Client Secret은 입력하지 않습니다. Web 서비스 URL에 아래 주소를 등록해야 합니다.</p><p id="mapOrigin"></p><a href="https://guide.ncloud-docs.com/docs/maps-app" target="_blank" rel="noopener noreferrer">공식 설정 안내</a><p>네이버 클라우드 이용요금·무료 한도를 확인한 뒤 설정하세요.</p><label>지도 Client ID <input id="mapKey" type="text" autocomplete="off" style="max-width:100%"></label><button class="ghost" id="mapConnect">저장하고 연결</button></details>';
  $('routeClose').onclick=closeRoute;$('mapOrigin').textContent=location.origin;
  let key='';try{key=localStorage.getItem('naver_map_client_id')||'';}catch(e){}$('mapKey').value=key;
  $('mapConnect').onclick=()=>{const k=$('mapKey').value.trim();if(!/^[a-zA-Z0-9_-]{5,100}$/.test(k)){alert('지도용 Client ID를 확인해 주세요.');return;}try{localStorage.setItem('naver_map_client_id',k);}catch(e){}drawNaverRoute(k,token);};
  try{
    const d=await diagRead(id);if(token!==routeToken)return;
    const basic=loadLog().find(x=>x.id===id);routeView={segments:routeSegments(d?.route),events:basic?.events||[]};
    $('routeTitle').textContent=(basic?fmtT(basic.start)+'~'+fmtT(basic.end)+' · ':'')+'운행 경로';
    drawRoutePreview(routeView.segments,routeView.events);
    $('routeEvents').innerHTML=routeView.events.map((e,i)=>'<button class="ghost routeEvent" data-event="'+i+'">'+(i+1)+'. '+escapeHTML(fmtS(e.t)+' '+e.n+' '+(e.l==='d'?'위반':'경고'))+'</button>').join('')||'<p>이벤트 없음</p>';
    document.querySelectorAll('.routeEvent').forEach(b=>b.onclick=()=>selectRouteEvent(Number(b.dataset.event)));
    $('mapStatus').textContent=d?.route?.length?'경로 미리보기 · 도로 배경 없음. 네이버지도는 아래 연결 설정 후 사용할 수 있어요.':'이 운행에는 저장된 경로가 없습니다.';
    if(key)drawNaverRoute(key,token);
  }catch(e){if(token===routeToken)$('mapStatus').textContent='경로를 읽지 못했습니다.';}
}

$('btn').onclick=()=>watch==null?start():stop();
$('hbtn').onclick=openHist;

  if(document.visibilityState==='hidden') saveDrive();
  if(document.visibilityState==='visible'&&watch!=null&&navigator.wakeLock){
    try{ lock=await navigator.wakeLock.request('screen'); }catch(e){}
  }
});
